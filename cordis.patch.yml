- id: webserver
  disabled: true

- id: web-startup
  name: ds-auths-plugin/startup

- insert:
    - id: dsh-auth
      name: ds-auths-plugin
      config:
        databasePath: !!js process.env.DSH_AUTH_DATABASE_PATH ?? dshHomePath('auth/v1/auth.db')
        bootstrapToken: !!js process.env.DSH_AUTH_BOOTSTRAP_TOKEN ?? ''
        bootstrapTtlMs: 900000
        sessionIdleTtlMs: 28800000
        sessionAbsoluteTtlMs: 86400000

    - id: auth-webserver
      name: ds-auths-plugin/webserver
      inject: [webStartup, authGateway]
      config:
        host: !!js ctx.webStartup.host
        port: !!js ctx.webStartup.port
        tls: !!js ctx.webStartup.tls
        cookieSecure: !!js process.env.DSH_AUTH_COOKIE_SECURE ?? 'auto'
        trustedHosts: !!js ctx.webStartup.trustedHosts

- id: connection
  name: '@deepseek-ai/dsh-client-connection'
  inject: [webStartup]
  config:
    trustedHosts: !!js ctx.webStartup.trustedHosts
